name: Disgaea 3 Vita3K-nx Switch Build

on:
  push:
    branches:
      - disgaea3-1.3.1-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      VITA3K_BUILD_JOBS: 4
      MESA_ASSET: mesa-26.2.3-switch-unified-horizon-sdk.zip
      MESA_RELEASE_TAG: mesa-sdk-26.2.3
      MESA_SHA256: 9b16d6dd07d01963d4c713281f3e6692cacca858195a143d7b2202afc2aeb346

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host and Switch dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y gh unzip ninja-build cmake python3 perl make curl pkg-config
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-zlib switch-zstd switch-expat switch-libelf switch-libdrm_nouveau

      - name: Apply Disgaea 3 performance patch
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check patches/disgaea3-uniform-dedup.patch
          git apply patches/disgaea3-uniform-dedup.patch
          grep -n "dedup_uniform" \
            vita3k/renderer/include/renderer/types.h \
            vita3k/renderer/src/renderer.cpp

      - name: Verify save-dialog compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          grep -n "icon buffer.*not mapped" vita3k/modules/SceCommonDialog/SceCommonDialog.cpp

      - name: Download Mesa 26.2.3 SDK release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build-switch-deps
          gh release download "$MESA_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$MESA_ASSET" \
            --dir build-switch-deps
          printf '%s  %s\n' "$MESA_SHA256" "build-switch-deps/$MESA_ASSET" | sha256sum --check --strict -

      - name: Extract and verify Mesa 26.2.3 SDK
        id: mesa
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-switch-deps/mesa-26.2.3
          mkdir -p build-switch-deps/mesa-26.2.3
          unzip -q "build-switch-deps/$MESA_ASSET" -d build-switch-deps/mesa-26.2.3

          SDK="$GITHUB_WORKSPACE/build-switch-deps/mesa-26.2.3/opt/devkitpro/portlibs/switch"
          test -f "$SDK/include/vulkan/vulkan.h"
          test -f "$SDK/include/EGL/egl.h"
          test -f "$SDK/include/GL/gl.h"
          test -f "$SDK/lib/libvulkan.a"
          test -f "$SDK/lib/libnvk.a"
          test -f "$SDK/lib/libEGL.a"
          test -f "$SDK/lib/libGL.a"
          test -f "$SDK/lib/cmake/OpenGL/OpenGLConfig.cmake"
          test -f "$SDK/lib/pkgconfig/vulkan.pc"
          grep -Fqx 'Version: 26.2.3' "$SDK/lib/pkgconfig/vulkan.pc"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

      - name: Prepare Switch OpenSSL
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/prepare-switch-openssl.sh

      - name: Apply Switch submodule patches
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/apply-switch-submodule-patches.sh

      - name: Configure Vita3K-nx
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-switch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DSWITCH_OPENSSL_DIR="$GITHUB_WORKSPACE/build-switch-deps/openssl-4.0.1" \
            -DSWITCH_VULKAN_SDK="${{ steps.mesa.outputs.sdk }}"

      - name: Build Vita3K.nro
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-switch -j"$VITA3K_BUILD_JOBS"

      - name: Stage NRO
        shell: bash
        run: |
          set -euxo pipefail
          NRO="$(find build-switch -type f -name '*.nro' | head -n1)"
          test -n "$NRO"
          cp "$NRO" Vita3K-Disgaea3-1.3.1-Mesa26.2.3-perf.nro
          sha256sum Vita3K-Disgaea3-1.3.1-Mesa26.2.3-perf.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Disgaea3-1.3.1-Mesa26.2.3-perf
          path: Vita3K-Disgaea3-1.3.1-Mesa26.2.3-perf.nro
          if-no-files-found: error
